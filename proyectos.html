<html lang="es">
<head>

<main id="contenido-principal" class="container">

    <div class="barra">

        <a href="/" aria-label="Retorno a página principal">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-fill" viewBox="0 0 16 16">
                <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>

            </svg>
        </a>
        
        <h2>Mariana Ongay Ortiz</h2>

         <button type="button" 
            class="theme-toggle" 
            id="theme-toggle" 
            aria-label="Cambiar a modo oscuro" 
            aria-pressed="false">
        
            <span class="theme-toggle__slider">
                
                <svg class="theme-toggle__icon theme-toggle__icon--inside theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.22" x2="5.64" y2="17.78"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>

                <svg class="theme-toggle__icon theme-toggle__icon--inside theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </span>
        </button>
    </div>

   

    <section class="proyectos" aria-labelledby="titulo-proyectos" data-aos="fade-up"  data-aos-duration="2000"> 
        <h2 id="titulo-proyectos">MIS PROYECTOS</h2>

        <div class="proyectos__content proyectos__content--all">
        </div> 
  
    </section> 

</main> <!--.container-->

    <script src="js/proyectos.js"></script>
    <script src="js/keyMovility.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
