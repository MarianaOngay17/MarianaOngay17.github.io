<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado lineal moderno para el fondo -->
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <!-- Fondo circular con esquinas sutilmente suavizadas (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#brand-gradient)" />

  <!-- Iniciales "MO" entrelazadas con tipografía geométrica y limpia -->
  <text x="50%" y="53%" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="210" 
        font-weight="900" 
        fill="#FFFFFF" 
        dominant-baseline="middle" 
        text-anchor="middle" 
        letter-spacing="-10">MO</text>
</svg>
